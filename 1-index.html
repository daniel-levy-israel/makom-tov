<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>מקום טוב - מוצאים חופשה בישראל</title><meta name="description" content="אלפי צימרים, וילות, דירות נופש ומקומות מיוחדים בישראל - בחיפוש אחד פשוט."><link rel="stylesheet" href="styles.css"></head><body>
<header><a class="brand" href="#">מקום<span>טוב</span></a><button id="favBtn" class="ghost">♡ שמורים <b id="favCount">0</b></button></header>
<section class="hero"><div class="hero-copy"><p class="eyebrow">כל החופשות בישראל. במקום אחד.</p><h1>החופשה הבאה שלכם<br><em>מתחילה כאן</em></h1><p>אלפי צימרים, וילות, דירות נופש ומקומות מיוחדים - בלי לעבור בין עשרות אתרים.</p></div>
<div class="searchbox"><div class="field grow"><label>לאן נוסעים?</label><input id="q" placeholder="יישוב, אזור או שם מקום" autocomplete="off"></div><div class="field"><label>סוג מקום</label><select id="category"><option value="">הכל</option></select></div><div class="field"><label>אורחים</label><select id="guests"><option value="0">לא משנה</option><option value="2">זוג</option><option value="4">4 ומעלה</option><option value="8">8 ומעלה</option><option value="12">12 ומעלה</option></select></div><button id="searchBtn" class="primary">חיפוש</button></div></section>
<main><section class="quick"><button data-quick="pool">🏊 בריכה</button><button data-quick="hot">♨️ ג׳קוזי</button><button data-quick="family">👨‍👩‍👧 למשפחות</button><button data-quick="view">⛰️ נוף</button><button data-quick="kosher">✡️ לציבור הדתי</button><button data-quick="book">⚡ הזמנה אונליין</button></section>
<div class="toolbar"><div><h2 id="resultTitle">מקומות שכדאי להכיר</h2><p id="count">טוענים מקומות...</p></div><button id="filterOpen" class="outline">☰ סינון</button><select id="sort" aria-label="מיון"><option value="smart">המומלצים ביותר</option><option value="price">מחיר נמוך</option></select></div>
<div class="layout"><aside id="filters"><div class="asideHead"><h3>סינון</h3><button id="filterClose">×</button></div><label>אזור</label><select id="region"><option value="">כל הארץ</option></select><label>מחיר ללילה עד <strong id="priceVal">₪2,500</strong></label><input id="price" type="range" min="300" max="2500" value="2500" step="100"><label class="check"><input id="withPrice" type="checkbox"> רק מקומות עם מחיר</label><button id="clear" class="linkbtn">ניקוי כל הסינונים</button></aside><section class="results"><div id="grid" class="grid"></div><button id="more" class="more">הצגת מקומות נוספים</button></section></div></main>
<div id="detail" class="modal" aria-hidden="true"><div class="shade"></div><article><button class="close">×</button><div id="detailBody"></div></article></div>
<div id="toast"></div><script src="app.js"></script></body></html>
